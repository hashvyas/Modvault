name: Web Application CI

on:
  push:
    branches: [main, p2-app]
  pull_request:
    branches: [main]

jobs:
  test-and-e2e:
    name: Build, Lint, Typecheck and E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: modvault_owner
          POSTGRES_PASSWORD: modvault_owner_dev
          POSTGRES_DB: modvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://modvault_owner:modvault_owner_dev@localhost:5432/modvault
      APP_DATABASE_URL: postgresql://modvault_app:modvault_app_dev@localhost:5432/modvault
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000000000000000000000000000
      # Throwaway CI database only; real passwords live in each developer's .env.
      ADMIN_PASSWORD: ci-admin-password
      CURATOR_PASSWORD: ci-curator-password
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            scripts/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # psql is preinstalled on ubuntu-latest, so no apt install is needed.

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-all-MiniLM-L6-v2

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Drop and rebuild database schema and seed
        run: |
          python scripts/db_reset.py

      - name: Verify seed expectations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed_expectations.sql

      - name: Install scripts dependencies and generate vector embeddings
        run: |
          npm --prefix scripts ci
          npm --prefix scripts run embed

      - name: Verify zero pending embeddings
        run: |
          PENDING=$(psql "$DATABASE_URL" -t -A -c "SELECT count(*) FROM mods WHERE embedding IS NULL;")
          if [ "$PENDING" -ne "0" ]; then
            echo "Error: Found $PENDING mods with NULL embeddings after embed run."
            exit 1
          fi
          echo "Verified: All mods successfully embedded."

      - name: Install web application dependencies
        run: |
          npm --prefix web ci

      - name: Web Lint check
        run: |
          npm --prefix web run lint

      - name: Web TypeScript typecheck
        run: |
          npm --prefix web run typecheck

      - name: Build Next.js standalone application
        run: |
          npm --prefix web run build

      - name: Install Playwright Chromium browser and OS dependencies
        run: |
          npx --prefix web playwright install --with-deps chromium

      - name: Run Playwright end-to-end demo test suite
        run: |
          npm --prefix web run test:e2e

      - name: Upload Playwright Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            docs/screenshots/
          retention-days: 7
